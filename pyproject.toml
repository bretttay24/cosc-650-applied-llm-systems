[project]
name = "cosc-650-applied-llm-systems"
version = "0.1.0"
description = "Course repository for COSC 650: Applied LLM Systems (Maryville University)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai",
    "python-dotenv",
    "ipykernel",
    "tiktoken",
    "transformers>=5.16.1",
    "numpy>=2.5.2",
    "matplotlib>=3.11.1",
    "azure-ai-projects>=2.6.0",
    "azure-identity>=1.25.3",
    "pydantic>=2.13.5",
    "jsonschema>=4.25.1",
    "sentence-transformers>=6.0.1",
    "pandas>=3.0.5",
    "mlflow>=3.16.1",
    "scikit-learn>=1.9.1",
    "langchain>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "pyaml>=26.7.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
]
