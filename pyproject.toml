[project]
name = "cosc-650-applied-llm-systems"
version = "0.1.0"
description = "Course repository for COSC 650: Applied LLM Systems (Maryville University)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai",
    "python-dotenv",
    "ipykernel",
    "tiktoken",
    "transformers>=5.16.1",
    "numpy>=2.5.2",
    "matplotlib>=3.11.1",
    "azure-ai-projects>=2.6.0",
    "azure-identity>=1.25.3",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
]
